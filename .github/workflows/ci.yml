name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go build ./cmd/shardkv
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T node1 /app/shardkv put -config cluster.docker.json ci-key ci-value; then
              break
            fi
            sleep 1
          done
          docker compose exec -T node1 /app/shardkv get -config cluster.docker.json ci-key | grep ci-value
          docker compose kill -s SIGKILL node2
          docker compose start node2
          for i in $(seq 1 30); do
            if docker compose exec -T node1 /app/shardkv get -config cluster.docker.json ci-key | grep ci-value; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - if: always()
        run: docker compose logs && docker compose down
